name: keep-warm

# Pings the FLUX health endpoint so Render's free tier does not spin the service
# down (~15 min idle). A cold start measured 13.5 s on 15 Sep and 20.0 s on
# 23 Sep, and in the iOS wrapper a cold start is a blank screen that never
# recovers - so this is a release-review risk, not a nicety.
#
# WHY THE JOB IS LONG-LIVED INSTEAD OF THE SCHEDULE BEING FREQUENT
# The first version asked for */5 and assumed GitHub would roughly honour it.
# Measured over 20-23 Sep it fired 20 times against ~904 expected - 2.2% - with
# a MEDIAN gap of 240 minutes and a maximum of 406. Every one of the 19 gaps
# exceeded the idle window, leaving the instance cold-eligible 93.7% of the
# period. The LaunchAgent it replaced managed 22.8%, so the "fix" was four times
# worse than the thing it replaced.
#
# Scheduled triggers are best-effort and heavily deprioritised; that is not
# tunable. What IS tunable is how much each firing covers. So each run now pings
# for ~5.8 hours, and the trigger only has to land occasionally. At the observed
# firing rate (~1 per 3.7 h) runs overlap, which is harmless - a duplicate ping
# costs nothing - and coverage stops depending on punctuality.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

# No concurrency group on purpose: overlapping runs are the mechanism, not a
# fault. Cancelling one would reopen the gap this design exists to close.

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Keep the instance warm
        run: |
          set -uo pipefail
          URL="https://fluxclash.com/api/health"
          END=$(( $(date +%s) + 350*60 ))
          fails=0; n=0
          while [ "$(date +%s)" -lt "$END" ]; do
            # --max-time generous: a COLD start is exactly what this absorbs, and
            # a spun-down instance answers slowly. The trailing \n matters -
            # without it `read` hits EOF and returns non-zero on success.
            read -r code total < <(curl -sS -o /dev/null -m 90 \
              -w '%{http_code} %{time_total}\n' "$URL" 2>/dev/null) || true
            n=$((n+1))
            if [ "${code:-000}" = "200" ]; then
              echo "$(date -u +%H:%M:%S)  HTTP $code  ${total}s"
            else
              fails=$((fails+1))
              echo "$(date -u +%H:%M:%S)  HTTP ${code:-000}  FAILED"
            fi
            # Keep pinging through a failure rather than exiting: ending the job
            # on one bad response would surrender the remaining hours of cover.
            sleep 600
          done
          echo "pings=$n failures=$fails"
          # Report at the END, so a failed run is still a real uptime signal
          # (GitHub emails on it) without costing coverage.
          [ "$fails" -eq 0 ] || { echo "::error::$fails of $n pings failed"; exit 1; }
